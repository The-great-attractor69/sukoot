<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سکوت</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kufam:wght@400&family=Reem+Kufi:wght@400..700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
    }
    body {
      background: linear-gradient(to bottom, rgba(22, 21, 15, 0.3), rgba(22, 21, 15, 0.6)), url('cosmos_1116398607.webp') center 20% / cover no-repeat fixed;
      color: #ffffff;
      font-family: 'Kufam', sans-serif;
      font-size: 16px;
      font-weight: 400;
    }
    .header {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
      padding-top: 8vh;
      padding-right: 7%;
      margin: 0;
    }
    .brand {
      color: #ffffff;
      font-family: 'Reem Kufi', 'Kufam', sans-serif;
      font-size: 30px;
      font-weight: 500;
      line-height: 1.3;
      text-decoration: none;
      white-space: nowrap;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 4rem;
    }
    .nav a {
      color: #ffffff;
      font-family: 'Kufam', sans-serif;
      font-size: 16px;
      font-weight: 400;
      text-decoration: none;
      background: none;
      white-space: nowrap;
    }
    @media (max-width: 700px) {
      .header {
        box-sizing: border-box;
        gap: 14px;
        padding-top: max(5vh, env(safe-area-inset-top));
      }
      .brand {
        font-size: 22px;
      }
      .nav {
        gap: 1.4rem;
      }
      .nav a {
        font-size: 14px;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <span class="brand">سکوت</span>
    <nav class="nav">
      <a href="#">فارسی</a>
      <a href="#">اردو</a>
      <a href="#">شعراء</a>
      <a href="#">مزید</a>
    </nav>
  </header>
</body>
</html>
